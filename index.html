<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>محفظة الصور والباركود</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f3f6fb;
  color:#172033;
}

button,input{
  font-family:inherit;
}

.hidden{
  display:none!important;
}

/* LOGIN */
#loginPage{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:linear-gradient(135deg,#0d6efd,#153d8f);
}

.login-box{
  width:100%;
  max-width:390px;
  background:white;
  padding:30px 24px;
  border-radius:24px;
  text-align:center;
  box-shadow:0 20px 50px #0004;
}

.logo{
  width:75px;
  height:75px;
  margin:auto;
  border-radius:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0d6efd;
  color:white;
  font-size:35px;
}

.login-box h1{
  margin:18px 0 8px;
}

.login-box p{
  color:#777;
}

.pass-input{
  width:100%;
  height:58px;
  border:2px solid #e1e6ef;
  border-radius:15px;
  text-align:center;
  font-size:25px;
  letter-spacing:10px;
  outline:none;
}

.pass-input:focus{
  border-color:#0d6efd;
}

.login-btn{
  width:100%;
  height:55px;
  margin-top:15px;
  border:0;
  border-radius:15px;
  background:#0d6efd;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.error{
  color:#e53935;
  margin-top:12px;
}

/* APP */
header{
  background:white;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 12px #0001;
  position:sticky;
  top:0;
  z-index:5;
}

header h2{
  margin:0;
  color:#0d6efd;
}

.logout{
  border:0;
  background:#ffe9e9;
  color:#d32f2f;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
}

.container{
  width:100%;
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

/* HOME */
.hero{
  background:linear-gradient(135deg,#0d6efd,#0052cc);
  color:white;
  padding:28px;
  border-radius:24px;
  margin-bottom:20px;
}

.hero h1{
  margin-top:0;
}

.main-card{
  background:white;
  padding:25px;
  border-radius:22px;
  box-shadow:0 5px 20px #0000000d;
  text-align:center;
}

.blue-btn{
  width:100%;
  min-height:100px;
  border:0;
  border-radius:20px;
  background:#0d6efd;
  color:white;
  font-size:21px;
  font-weight:bold;
  cursor:pointer;
}

.blue-btn:hover{
  background:#095ac9;
}

/* CARDS */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}

.card{
  background:white;
  padding:20px;
  border-radius:20px;
  box-shadow:0 5px 20px #0000000d;
}

/* QR */
.qr-box{
  margin-top:20px;
  text-align:center;
}

#qrcode{
  display:inline-block;
  padding:15px;
  background:white;
  border-radius:15px;
}

.preview{
  max-width:100%;
  max-height:300px;
  border-radius:15px;
  margin:15px auto;
  display:block;
}

.action{
  border:0;
  padding:12px 18px;
  border-radius:12px;
  cursor:pointer;
  margin:5px;
}

.save{
  background:#0d6efd;
  color:white;
}

.delete{
  background:#ffe3e3;
  color:#d32f2f;
}

.back{
  background:#eee;
}

/* VAULT */
.vault-item{
  background:white;
  padding:15px;
  border-radius:18px;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.vault-item img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:12px;
}

.empty{
  text-align:center;
  padding:40px 15px;
  color:#777;
}

/* NAV */
nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  display:flex;
  justify-content:center;
  gap:5px;
  padding:10px;
  box-shadow:0 -3px 15px #0001;
  z-index:10;
}

nav button{
  border:0;
  background:white;
  padding:10px 13px;
  border-radius:12px;
  cursor:pointer;
  color:#555;
}

nav button.active{
  background:#e7f0ff;
  color:#0d6efd;
  font-weight:bold;
}

.app-space{
  padding-bottom:80px;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:50;
}

.modal-box{
  background:white;
  width:100%;
  max-width:400px;
  padding:25px;
  border-radius:22px;
  text-align:center;
}

.modal input{
  width:100%;
  height:52px;
  border:1px solid #ddd;
  border-radius:12px;
  text-align:center;
  font-size:22px;
}

@media(max-width:500px){
  .container{
    padding:14px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginPage">
  <div class="login-box">
    <div class="logo">🔐</div>

    <h1>محفظة الصور</h1>
    <p>أدخل كلمة المرور للدخول</p>

    <input
      id="loginPassword"
      class="pass-input"
      type="password"
      inputmode="numeric"
      maxlength="4"
      placeholder="••••"
    >

    <button class="login-btn" onclick="login()">
      دخول
    </button>

    <div id="loginError" class="error"></div>
  </div>
</section>


<!-- APPLICATION -->
<section id="app" class="hidden">

<header>
  <h2>📦 محفظتي</h2>
  <button class="logout" onclick="logout()">خروج</button>
</header>

<div class="app-space">

<div class="container">

<!-- HOME -->
<div id="homePage" class="page active">

  <div class="hero">
    <h1>تحويل الصور إلى باركود</h1>
    <p>
      اختر صورة وسيتم إنشاء QR قابل للمسح.
    </p>
  </div>

  <div class="main-card">

    <button class="blue-btn" onclick="openUploader()">
      📷 تحويل الصور إلى باركود
    </button>

    <input
      id="imageInput"
      type="file"
      accept="image/*"
      hidden
      onchange="createQR(event)"
    >

  </div>

</div>


<!-- QR PAGE -->
<div id="qrPage" class="page">

  <div class="card">

    <h2>إنشاء الباركود</h2>

    <img id="preview"
         class="preview hidden">

    <div id="qrcode" class="qr-box"></div>

    <br>

    <button class="action save"
            onclick="saveQR()">
      💾 حفظ الباركود
    </button>

    <button class="action back"
            onclick="showPage('homePage')">
      رجوع
    </button>

  </div>

</div>


<!-- VAULT -->
<div id="vaultPage" class="page">

  <h2>🗂️ محفظة حفظ الباركود</h2>

  <div id="vault"></div>

</div>


<!-- DEVICES -->
<div id="devicesPage" class="page">

  <h2>📱 الأجهزة</h2>

  <div class="card">

    <p>
      هذه الصفحة مخصصة لصاحب التطبيق.
    </p>

    <div id="devices"></div>

  </div>

</div>

</div>

</div>


<nav>

  <button onclick="showPage('homePage')">
    🏠 الرئيسية
  </button>

  <button onclick="showPage('vaultPage')">
    🗂️ المحفظة
  </button>

  <button onclick="showPage('devicesPage')">
    📱 الأجهزة
  </button>

</nav>

</section>


<!-- OPEN QR PASSWORD -->
<div id="openModal" class="modal hidden">

  <div class="modal-box">

    <h2>🔐 الصورة محمية</h2>

    <p>أدخل كلمة المرور لفتح الصورة</p>

    <input
      id="openPassword"
      type="password"
      inputmode="numeric"
      maxlength="4"
      placeholder="••••"
    >

    <p id="openError" class="error"></p>

    <button class="action save"
            onclick="openProtectedImage()">
      فتح الصورة
    </button>

    <button class="action back"
            onclick="closeModal()">
      إلغاء
    </button>

  </div>

</div>


<script>

/* =========================
   SETTINGS
========================= */

const LOGIN_PASSWORD = "9119";
const IMAGE_PASSWORD = "9000";

let currentImage = "";
let currentQR = "";


/* =========================
   LOGIN
========================= */

function login(){

  const password =
    document.getElementById("loginPassword").value;

  if(password === LOGIN_PASSWORD){

    document.getElementById("loginPage")
      .classList.add("hidden");

    document.getElementById("app")
      .classList.remove("hidden");

    registerDevice();

  }else{

    document.getElementById("loginError")
      .textContent =
      "كلمة المرور غير صحيحة";

  }
}


function logout(){

  document.getElementById("app")
    .classList.add("hidden");

  document.getElementById("loginPage")
    .classList.remove("hidden");

  document.getElementById("loginPassword")
    .value = "";

}


/* =========================
   NAVIGATION
========================= */

function showPage(pageId){

  document
    .querySelectorAll(".page")
    .forEach(page =>
      page.classList.remove("active")
    );

  document
    .getElementById(pageId)
    .classList.add("active");

  if(pageId === "vaultPage"){
    loadVault();
  }

  if(pageId === "devicesPage"){
    loadDevices();
  }

}


/* =========================
   UPLOAD
========================= */

function openUploader(){

  document
    .getElementById("imageInput")
    .click();

}


/* =========================
   CREATE QR
========================= */

function createQR(event){

  const file =
    event.target.files[0];

  if(!file) return;

  const reader =
    new FileReader();

  reader.onload = function(e){

    currentImage = e.target.result;

    const preview =
      document.getElementById("preview");

    preview.src = currentImage;

    preview.classList.remove("hidden");

    document
      .getElementById("qrcode")
      .innerHTML = "";

    /*
      في هذا الإصدار المحلي:
      نخزن الصورة داخل بيانات QR.
      للصور الكبيرة جداً قد يتجاوز ذلك
      قدرة QR، ولذلك النسخة الحقيقية
      متعددة الأجهزة تحتاج Backend.
    */

    currentQR =
      "IMAGE:" +
      btoa(unescape(
        encodeURIComponent(currentImage)
      ));

    try{

      new QRCode(
        document.getElementById("qrcode"),
        {
          text: currentQR,
          width:260,
          height:260,
          correctLevel:QRCode.CorrectLevel.L
        }
      );

      showPage("qrPage");

    }catch(error){

      alert(
        "الصورة كبيرة جداً بالنسبة إلى QR مباشر. استخدم نسخة الخادم للصور الكبيرة."
      );

    }

  };

  reader.readAsDataURL(file);

}


/* =========================
   SAVE QR
========================= */

function saveQR(){

  if(!currentQR){
    alert("أنشئ باركود أولاً");
    return;
  }

  const vault =
    JSON.parse(
      localStorage.getItem("qrVault") || "[]"
    );

  const item = {

    id:
      Date.now().toString(),

    image:
      currentImage,

    qr:
      currentQR,

    date:
      new Date().toLocaleString("ar-IQ"),

    active:
      true

  };

  vault.push(item);

  localStorage.setItem(
    "qrVault",
    JSON.stringify(vault)
  );

  alert("تم حفظ الباركود في المحفظة");

  loadVault();

  showPage("vaultPage");

}


/* =========================
   LOAD VAULT
========================= */

function loadVault(){

  const vault =
    JSON.parse(
      localStorage.getItem("qrVault") || "[]"
    );

  const box =
    document.getElementById("vault");

  box.innerHTML = "";

  if(vault.length === 0){

    box.innerHTML =
      `<div class="empty">
        لا توجد باركودات محفوظة
      </div>`;

    return;
  }

  vault.reverse().forEach(item => {

    const div =
      document.createElement("div");

    div.className = "vault-item";

    div.innerHTML = `

      <img src="${item.image}">

      <div style="flex:1">
        <b>باركود صورة</b>
        <small style="display:block;color:#777">
          ${item.date}
        </small>
        <small style="color:${item.active ? '#198754':'#d32f2f'}">
          ${item.active ? 'فعال' : 'معطل'}
        </small>
      </div>

      <button class="action save"
        onclick="showSavedQR('${item.id}')">
        عرض
      </button>

      <button class="action delete"
        onclick="deleteQR('${item.id}')">
        حذف
      </button>

    `;

    box.appendChild(div);

  });

}


/* =========================
   SHOW SAVED QR
========================= */

function showSavedQR(id){

  const vault =
    JSON.parse(
      localStorage.getItem("qrVault") || "[]"
    );

  const item =
    vault.find(x => x.id === id);

  if(!item || !item.active){

    alert("هذا الباركود محذوف أو معطل");

    return;
  }

  currentQR = item.qr;
  currentImage = item.image;

  document.getElementById("preview").src =
    item.image;

  document.getElementById("preview")
    .classList.remove("hidden");

  document.getElementById("qrcode")
    .innerHTML = "";

  new QRCode(
    document.getElementById("qrcode"),
    {
      text:item.qr,
      width:260,
      height:260,
      correctLevel:QRCode.CorrectLevel.L
    }
  );

  showPage("qrPage");

}


/* =========================
   DELETE QR
========================= */

function deleteQR(id){

  if(!confirm(
    "هل تريد حذف الباركود نهائياً؟"
  )) return;

  let vault =
    JSON.parse(
      localStorage.getItem("qrVault") || "[]"
    );

  /*
    الحذف هنا نهائي من المحفظة المحلية،
    وبالتالي يتم تعطيل العنصر.
  */

  vault =
    vault.filter(x => x.id !== id);

  localStorage.setItem(
    "qrVault",
    JSON.stringify(vault)
  );

  loadVault();

}


/* =========================
   PROTECTED IMAGE
========================= */

function openProtectedImage(){

  const password =
    document.getElementById("openPassword").value;

  if(password !== IMAGE_PASSWORD){

    document.getElementById("openError")
      .textContent =
      "كلمة المرور غير صحيحة";

    return;

  }

  closeModal();

  if(currentImage){

    const win =
      window.open();

    win.document.write(`
      <html dir="rtl">
      <head>
        <title>الصورة</title>
      </head>
      <body style="
        margin:0;
        background:#111;
        display:flex;
        align-items:center;
        justify-content:center;
        min-height:100vh;
      ">
        <img
          src="${currentImage}"
          style="
            max-width:100%;
            max-height:100vh;
            object-fit:contain;
          "
        >
      </body>
      </html>
    `);

  }

}


function closeModal(){

  document
    .getElementById("openModal")
    .classList.add("hidden");

  document
    .getElementById("openPassword")
    .value = "";

}


/* =========================
   DEVICES
========================= */

function getDeviceId(){

  let id =
    localStorage.getItem("my_device_id");

  if(!id){

    id =
      "DEV-" +
      Math.random()
        .toString(36)
        .substring(2,10)
        .toUpperCase();

    localStorage.setItem(
      "my_device_id",
      id
    );

  }

  return id;

}


function registerDevice(){

  const devices =
    JSON.parse(
      localStorage.getItem("devices") || "[]"
    );

  const id = getDeviceId();

  let device =
    devices.find(x => x.id === id);

  if(!device){

    device = {

      id:id,

      name:
        navigator.userAgent
          .substring(0,45),

      date:
        new Date().toLocaleString("ar-IQ"),

      blocked:false

    };

    devices.push(device);

  }

  localStorage.setItem(
    "devices",
    JSON.stringify(devices)
  );

}


function loadDevices(){

  const devices =
    JSON.parse(
      localStorage.getItem("devices") || "[]"
    );

  const box =
    document.getElementById("devices");

  box.innerHTML = "";

  if(devices.length === 0){

    box.innerHTML =
      "<p>لا توجد أجهزة.</p>";

    return;

  }

  devices.forEach(device => {

    const div =
      document.createElement("div");

    div.className = "card";

    div.style.marginBottom = "10px";

    div.innerHTML = `

      <b>${device.id}</b>

      <p style="color:#777">
        ${device.name}
      </p>

      <p>
        الحالة:
        ${device.blocked
          ? "🚫 محظور"
          : "✅ مسموح"}
      </p>

      <button
        class="action ${device.blocked
          ? 'save'
          : 'delete'}"
        onclick="toggleBlock('${device.id}')">

        ${device.blocked
          ? "إلغاء الحظر"
          : "حظر الجهاز"}

      </button>

    `;

    box.appendChild(div);

  });

}


function toggleBlock(id){

  let devices =
    JSON.parse(
      localStorage.getItem("devices") || "[]"
    );

  devices =
    devices.map(device => {

      if(device.id === id){

        device.blocked =
          !device.blocked;

      }

      return device;

    });

  localStorage.setItem(
    "devices",
    JSON.stringify(devices)
  );

  loadDevices();

}


/* =========================
   START
========================= */

document
  .getElementById("loginPassword")
  .addEventListener(
    "keydown",
    function(e){

      if(e.key === "Enter"){
        login();
      }

    }
  );

</script>

</body>
</html>
