<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>محفظتي</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f2f5fa;color:#172033}
.hidden{display:none!important}

#login{
min-height:100vh;display:flex;align-items:center;
justify-content:center;padding:20px;
background:linear-gradient(135deg,#075bd6,#062b68)
}
.login-box{
width:100%;max-width:390px;background:white;
padding:30px;border-radius:25px;text-align:center;
box-shadow:0 20px 60px #0005
}
.logo{font-size:48px}
.login-box input{
width:100%;height:58px;border:2px solid #ddd;
border-radius:15px;text-align:center;font-size:25px;
letter-spacing:8px
}
.login-box button{
width:100%;height:55px;margin-top:15px;
border:0;border-radius:15px;background:#087cff;
color:white;font-size:18px;font-weight:bold
}
#error{color:#d32f2f;margin-top:12px}

header{
height:70px;background:white;display:flex;
align-items:center;justify-content:space-between;
padding:0 20px;box-shadow:0 2px 12px #0001
}
header h2{color:#075ed6}
.logout{
background:#ffe5e5;color:#c62828;
border:0;padding:11px 18px;border-radius:12px
}

.container{max-width:900px;margin:auto;padding:18px 15px 100px}
.page{display:none}
.page.active{display:block}

.hero{
background:linear-gradient(135deg,#064bb9,#03245c);
color:white;padding:30px;border-radius:25px;
margin-bottom:18px
}
.hero h1{font-size:30px;margin:0 0 10px}

.card{
background:white;padding:22px;border-radius:22px;
box-shadow:0 5px 20px #0000000d;margin-bottom:15px
}

.big-btn{
width:100%;min-height:110px;border:0;
border-radius:22px;background:#087cff;color:white;
font-size:21px;font-weight:bold
}

#preview{
display:block;max-width:100%;max-height:350px;
margin:15px auto;border-radius:15px
}

#qrcode{
display:flex;justify-content:center;
padding:15px;background:white
}

.btn{
border:0;padding:12px 18px;
border-radius:12px;margin:5px
}
.blue{background:#087cff;color:white}
.red{background:#ffe5e5;color:#c62828}
.gray{background:#eee;color:#333}

.item{
display:flex;align-items:center;gap:12px;
background:white;padding:12px;
border-radius:17px;margin-bottom:10px
}
.item img{
width:70px;height:70px;object-fit:cover;
border-radius:12px
}
.grow{flex:1}

nav{
position:fixed;bottom:0;left:0;right:0;
background:white;display:flex;
justify-content:center;gap:5px;padding:10px;
box-shadow:0 -3px 15px #0001
}
nav button{
border:0;background:white;padding:10px 15px;
border-radius:12px;color:#555
}

@media(max-width:600px){
.hero h1{font-size:25px}
.item{flex-wrap:wrap}
}
</style>
</head>

<body>

<div id="login">
<div class="login-box">
<div class="logo">🔐</div>
<h1>محفظتي</h1>
<p>أدخل كلمة المرور للدخول</p>

<input
id="password"
type="password"
inputmode="numeric"
maxlength="4"
placeholder="••••">

<button onclick="login()">دخول</button>
<div id="error"></div>
</div>
</div>

<div id="app" class="hidden">

<header>
<h2>📦 محفظتي</h2>
<button class="logout" onclick="logout()">خروج</button>
</header>

<div class="container">

<div id="home" class="page active">

<div class="hero">
<h1>تحويل الصور إلى باركود</h1>
<p>ارفع صورة كبيرة أو صغيرة وسيتم تجهيزها للباركود.</p>
</div>

<div class="card">

<button class="big-btn" onclick="document.getElementById('file').click()">
📷 اختيار صورة
</button>

<input
id="file"
type="file"
accept="image/*"
hidden
onchange="makeQR(event)">

</div>
</div>

<div id="qr" class="page">

<div class="card">

<h2>🔳 الباركود</h2>

<img id="preview">

<div id="qrcode"></div>

<button class="btn blue" onclick="downloadQR()">
💾 حفظ الباركود
</button>

<button class="btn gray" onclick="show('home')">
رجوع
</button>

</div>
</div>

<div id="vault" class="page">

<h2>🗂️ محفظة حفظ الباركود</h2>

<div id="vaultList"></div>

</div>

<div id="devices" class="page">

<h2>📱 الأجهزة</h2>

<div class="card">
<p>صفحة الأجهزة الخاصة بصاحب التطبيق.</p>
<p>الجهاز الحالي: <span id="deviceID"></span></p>
</div>

</div>

</div>

<nav>
<button onclick="show('home')">🏠 الرئيسية</button>
<button onclick="show('vault');loadVault()">🗂️ المحفظة</button>
<button onclick="show('devices')">📱 الأجهزة</button>
</nav>

</div>

<script>

const LOGIN_PASSWORD="9119";

let currentImage="";
let currentQR="";

function login(){

const p=document.getElementById("password").value;

if(p==="9119"){

document.getElementById("login").classList.add("hidden");
document.getElementById("app").classList.remove("hidden");

let id=localStorage.getItem("device_id");

if(!id){
id="DEV-"+Math.random().toString(36).substring(2,10).toUpperCase();
localStorage.setItem("device_id",id);
}

document.getElementById("deviceID").textContent=id;

}else{

document.getElementById("error").textContent=
"كلمة المرور غير صحيحة";

}
}

function logout(){

localStorage.removeItem("logged");
location.reload();

}

function show(id){

document.querySelectorAll(".page").forEach(x=>{
x.classList.remove("active");
});

document.getElementById(id).classList.add("active");

}

async function makeQR(event){

const file=event.target.files[0];

if(!file)return;

if(!file.type.startsWith("image/")){

alert("يرجى اختيار صورة فقط");
return;

}

/*
نقبل الصورة مهما كان حجمها.
إذا كانت ضخمة يتم تصغير نسخة العرض
بدلاً من رفض الصورة.
*/

const img=new Image();

const reader=new FileReader();

reader.onload=function(e){

img.onload=function(){

const MAX=2000;

let w=img.width;
let h=img.height;

if(w>MAX || h>MAX){

const ratio=Math.min(MAX/w,MAX/h);

w=Math.round(w*ratio);
h=Math.round(h*ratio);

}

const canvas=document.createElement("canvas");

canvas.width=w;
canvas.height=h;

const ctx=canvas.getContext("2d");

ctx.drawImage(img,0,0,w,h);

currentImage=canvas.toDataURL(
"image/jpeg",
0.85
);

document.getElementById("preview").src=currentImage;

document.getElementById("qrcode").innerHTML="";

/*
في هذا الإصدار يتم إنشاء QR من معرف
محلي بدلاً من وضع الصورة الأصلية كاملة
داخل QR، لذلك لا تظهر مشكلة الحجم.
*/

const id=
"IMG-"+Date.now()+"-"+Math.random()
.toString(36).substring(2,8);

currentQR=
location.href.split("?")[0]+
"?image="+id;

new QRCode(
document.getElementById("qrcode"),
{
text:currentQR,
width:280,
height:280,
correctLevel:QRCode.CorrectLevel.M
}
);

saveData(id,currentImage,currentQR);

show("qr");

};

img.src=e.target.result;

};

reader.readAsDataURL(file);

}

function saveData(id,image,qr){

let list=
JSON.parse(
localStorage.getItem("barcode_vault")||"[]"
);

list.push({
id:id,
image:image,
qr:qr,
date:new Date().toLocaleString("ar-IQ"),
active:true
});

localStorage.setItem(
"barcode_vault",
JSON.stringify(list)
);

}

function loadVault(){

const list=
JSON.parse(
localStorage.getItem("barcode_vault")||"[]"
);

const box=document.getElementById("vaultList");

box.innerHTML="";

if(!list.length){

box.innerHTML=
'<div class="card">لا توجد باركودات محفوظة.</div>';

return;

}

list.slice().reverse().forEach(item=>{

const div=document.createElement("div");

div.className="item";

div.innerHTML=`

<img src="${item.image}">

<div class="grow">
<b>باركود صورة</b>
<br>
<small>${item.date}</small>
<br>
<small style="color:green">
${item.active?"فعال":"معطل"}
</small>
</div>

<button class="btn blue"
onclick="viewQR('${item.id}')">
عرض
</button>

<button class="btn red"
onclick="deleteQR('${item.id}')">
حذف
</button>

`;

box.appendChild(div);

});

}

function viewQR(id){

const list=
JSON.parse(
localStorage.getItem("barcode_vault")||"[]"
);

const item=list.find(x=>x.id===id);

if(!item||!item.active){

alert("هذا الباركود محذوف أو معطل");
return;

}

currentImage=item.image;
currentQR=item.qr;

document.getElementById("preview").src=item.image;

document.getElementById("qrcode").innerHTML="";

new QRCode(
document.getElementById("qrcode"),
{
text:item.qr,
width:280,
height:280,
correctLevel:QRCode.CorrectLevel.M
}
);

show("qr");

}

function deleteQR(id){

if(!confirm(
"هل تريد حذف الباركود نهائياً؟"
))return;

let list=
JSON.parse(
localStorage.getItem("barcode_vault")||"[]"
);

list=list.filter(x=>x.id!==id);

localStorage.setItem(
"barcode_vault",
JSON.stringify(list)
);

loadVault();

}

function downloadQR(){

const qr=document
.getElementById("qrcode")
.querySelector("img");

if(!qr){

alert("لا يوجد باركود");
return;

}

const a=document.createElement("a");

a.href=qr.src;

a.download="barcode.png";

a.click();

}

document.getElementById("password")
.addEventListener("keydown",e=>{

if(e.key==="Enter")login();

});

</script>

</body>
</html>
