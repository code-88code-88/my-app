<script>

const PASSWORD = "9119";
const IMAGE_PASSWORD = "9000";

let enteredPin = "";
let currentImage = null;
let currentImageId = null;
let pendingOpenId = null;

function press(number){
  if(enteredPin.length >= 4) return;
  enteredPin += String(number);
  updatePin();
  if(enteredPin.length === 4){
    setTimeout(function(){ login(); },180);
  }
}

function updatePin(){
  for(let i=1;i<=4;i++){
    const box = document.getElementById("p"+i);
    if(i <= enteredPin.length){
      box.textContent = "●";
      box.classList.add("active");
    }else{
      box.textContent = "";
      box.classList.remove("active");
    }
  }
}

function clearPin(){
  enteredPin = enteredPin.slice(0,-1);
  document.getElementById("error").textContent = "";
  updatePin();
}

function login(){
  if(enteredPin.length !== 4) return;
  if(enteredPin === PASSWORD){
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").style.display = "block";
    enteredPin = "";
    updatePin();
    loadFriends();
    loadDevices();
    showFire();
  }else{
    document.getElementById("error").textContent = "رمز الدخول غير صحيح";
    enteredPin = "";
    updatePin();
  }
}

function showFire(){
  const fire = document.getElementById("fire");
  fire.style.display = "flex";
  setTimeout(function(){ fire.style.display = "none"; },2700);
}

function showPage(page,button){
  document.querySelectorAll(".page").forEach(function(p){ p.classList.remove("active"); });
  document.getElementById(page).classList.add("active");
  document.querySelectorAll(".tab").forEach(function(t){ t.classList.remove("active"); });
  button.classList.add("active");
}

document.getElementById("imageInput").addEventListener("change", createBarcode);

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function createBarcode(event){
  const file = event.target.files[0];
  if(!file) return;
  if(!file.type.startsWith("image/")){
    alert("اختر صورة فقط.");
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e){
    currentImage = e.target.result;
    currentImageId = "IMG-" + Date.now() + "-" +
      Math.random().toString(36).substring(2,8).toUpperCase();

    const preview = document.getElementById("preview");
    preview.src = currentImage;
    preview.style.display = "block";

    const qrBox = document.getElementById("qrBox");
    qrBox.innerHTML = "";
    qrBox.style.display = "block";

    if(typeof QRCode === "undefined"){
      qrBox.innerHTML = "<p style='color:#111'>تعذر تحميل مكتبة QR. تأكد من اتصال الإنترنت.</p>";
      return;
    }

    new QRCode(qrBox,{
      text:currentImageId,
      width:280,
      height:280,
      correctLevel:QRCode.CorrectLevel.M
    });

    const info = document.getElementById("qrInfo");
    info.style.display = "block";
    info.innerHTML =
      "رمز الصورة:<br><strong>" + escapeHtml(currentImageId) +
      "</strong><br><br>كلمة فتح الصورة: <strong>9000</strong>";

    document.getElementById("saveQR").style.display = "block";
  };
  reader.readAsDataURL(file);
}

function saveQR(){
  if(!currentImage || !currentImageId){
    alert("لا توجد صورة لحفظها.");
    return;
  }
  const items = JSON.parse(localStorage.getItem("walletItems") || "[]");
  items.push({
    id: currentImageId,
    image: currentImage,
    date: new Date().toLocaleString("ar")
  });
  localStorage.setItem("walletItems", JSON.stringify(items));

  alert("تم حفظ الباركود بنجاح.");

  document.getElementById("preview").style.display = "none";
  document.getElementById("qrBox").style.display = "none";
  document.getElementById("qrInfo").style.display = "none";
  document.getElementById("saveQR").style.display = "none";
  document.getElementById("imageInput").value = "";

  currentImage = null;
  currentImageId = null;

  loadFriends();
}

function loadFriends(){
  const items = JSON.parse(localStorage.getItem("walletItems") || "[]");
  const list = document.getElementById("friendsList");

  if(items.length === 0){
    list.innerHTML = "<div class='main-card'><p>لا توجد عناصر محفوظة بعد.</p></div>";
    return;
  }

  list.innerHTML = items.map(function(item){
    return "<div class='item'>" +
      "<div class='item-title'>" + escapeHtml(item.id) + "</div>" +
      "<div class='item-info'>تاريخ الحفظ: " + escapeHtml(item.date) + "</div>" +
      "</div>";
  }).join("");
}

function openProtectedImage(){
  const code = document.getElementById("openCode").value.trim();
  if(!code){
    alert("أدخل رمز الصورة.");
    return;
  }
  const items = JSON.parse(localStorage.getItem("walletItems") || "[]");
  const found = items.find(function(i){ return i.id === code; });

  if(!found){
    alert("الرمز غير موجود.");
    return;
  }

  pendingOpenId = code;
  document.getElementById("imagePassword").value = "";
  document.getElementById("passwordModal").style.display = "flex";
}

function checkImagePassword(){
  const pass = document.getElementById("imagePassword").value.trim();

  if(pass !== IMAGE_PASSWORD){
    alert("كلمة السر غير صحيحة.");
    return;
  }

  const items = JSON.parse(localStorage.getItem("walletItems") || "[]");
  const found = items.find(function(i){ return i.id === pendingOpenId; });

  closeModal();

  if(found){
    const preview = document.getElementById("preview");
    preview.src = found.image;
    preview.style.display = "block";
    preview.scrollIntoView({behavior:"smooth"});
  }
}

function closeModal(){
  document.getElementById("passwordModal").style.display = "none";
  pendingOpenId = null;
}

function loadDevices(){
  let deviceId = localStorage.getItem("deviceId");
  if(!deviceId){
    deviceId = "DEV-" + Date.now() + "-" +
      Math.random().toString(36).substring(2,6).toUpperCase();
    localStorage.setItem("deviceId", deviceId);
  }

  let devices = JSON.parse(localStorage.getItem("devices") || "[]");
  let current = devices.find(function(d){ return d.id === deviceId; });

  if(!current){
    current = {
      id: deviceId,
      name: navigator.userAgent.substring(0,40),
      date: new Date().toLocaleString("ar"),
      status: "active"
    };
    devices.push(current);
  }else{
    current.date = new Date().toLocaleString("ar");
  }

  localStorage.setItem("devices", JSON.stringify(devices));
  renderDevices();
}

function renderDevices(){
  const devices = JSON.parse(localStorage.getItem("devices") || "[]");
  const list = document.getElementById("devicesList");

  if(devices.length === 0){
    list.innerHTML = "<div class='main-card'><p>لا توجد أجهزة مسجلة.</p></div>";
    return;
  }

  list.innerHTML = devices.map(function(d){
    const blocked = d.status === "blocked";
    return "<div class='device'>" +
      "<div class='device-row'>" +
        "<div>" +
          "<div class='item-title'>" + escapeHtml(d.name) + "</div>" +
          "<div class='item-info'>آخر ظهور: " + escapeHtml(d.date) + "</div>" +
        "</div>" +
        "<span class='status" + (blocked ? " blocked" : "") + "'>" +
          (blocked ? "محظور" : "نشط") +
        "</span>" +
      "</div>" +
      "<button class='" + (blocked ? "unblock" : "block") + "' " +
        "onclick=\"toggleDevice('" + d.id + "')\">" +
        (blocked ? "إلغاء الحظر" : "حظر الجهاز") +
      "</button>" +
    "</div>";
  }).join("");
}

function toggleDevice(id){
  const devices = JSON.parse(localStorage.getItem("devices") || "[]");
  const d = devices.find(function(x){ return x.id === id; });
  if(!d) return;
  d.status = d.status === "blocked" ? "active" : "blocked";
  localStorage.setItem("devices", JSON.stringify(devices));
  renderDevices();
}

function logout(){
  document.getElementById("app").style.display = "none";
  document.getElementById("loginScreen").style.display = "flex";
  enteredPin = "";
  updatePin();
}

</script>
</body>
</html>
